name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  tier1:
    name: tier 1 (fmt, clippy, test, coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (pedantic and nursery, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tier-1 tests
        run: cargo test --workspace
      - name: Docs (missing docs denied)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - name: Static gates
        run: cargo xtask gates
      - name: STE check of docs and comments
        run: cargo xtask ste
      - name: Coverage gate (llvm-tools)
        run: cargo xtask cov

  tier2:
    name: tier 2 (ignored tests, offline build, test times, hermetic run, fuzz, bench)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The fix_commits step reads the full history.
          fetch-depth: 0
      - name: Install clang and llvm
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Tier-2 tests
        run: cargo test --workspace -- --include-ignored
      - name: Offline build, test times, hermetic run and fix commits
        run: cargo xtask ci --steps offline_build,tier1,test_times,test_hermetic,fix_commits
      - name: Long fuzz runs (100,000 cases per target)
        run: cargo xtask fuzz
      - name: Benchmarks against perf/budget.json
        run: cargo xtask bench

  verus:
    name: verus (kernel proofs)
    runs-on: ubuntu-24.04
    env:
      VERUS_REPO: https://github.com/verus-lang/verus
      VERUS_COMMIT: ffc9d20fee64da92cb037be195b467dd321ae4e3
      VERUS_TOOLCHAIN: 1.98.1
      Z3_VERSION: 4.16.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the Verus toolchain
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt
      - name: Cache the Verus build
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/verus-src/source/target-verus/release
            ${{ runner.temp }}/verus-src/source/z3
          key: verus-ffc9d20-rust-1.98.1-z3-4.16.0-v1
      - name: Fetch the Verus commit ffc9d20
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/verus-src"
          git -C "$RUNNER_TEMP/verus-src" remote add origin "$VERUS_REPO"
          git -C "$RUNNER_TEMP/verus-src" fetch --depth 1 origin "$VERUS_COMMIT"
          git -C "$RUNNER_TEMP/verus-src" checkout --detach FETCH_HEAD
      - name: Get z3 4.16.0 from the PyPI wheel z3_solver-4.16.0.0
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip download "z3-solver==$Z3_VERSION" --no-deps --only-binary=:all: --dest z3-wheel
          python3 -I -c "import glob, os, zipfile; z = zipfile.ZipFile(glob.glob('z3-wheel/z3_solver-4.16.0.0-*.whl')[0]); open(os.environ['RUNNER_TEMP'] + '/verus-src/source/z3', 'wb').write(z.read('z3_solver-4.16.0.0.data/data/bin/z3'))"
          chmod +x "$RUNNER_TEMP/verus-src/source/z3"
          "$RUNNER_TEMP/verus-src/source/z3" --version
      - name: Build Verus from source
        if: steps.verus-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/verus-src/source
        env:
          VERUS_Z3_PATH: ${{ runner.temp }}/verus-src/source/z3
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo +"$VERUS_TOOLCHAIN" build --release
          cargo +"$VERUS_TOOLCHAIN" run --release -p cargo-verus -- build --release --manifest-path vstd/Cargo.toml
      - name: Verify the kernels
        env:
          VERUS: ${{ runner.temp }}/verus-src/source/target-verus/release/verus
          VERUS_Z3_PATH: ${{ runner.temp }}/verus-src/source/z3
        run: cargo xtask verify

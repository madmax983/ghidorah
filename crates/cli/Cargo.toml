[package]
name = "ghidorah"
description = "The ghidorah command line: MCP stdio server for both protocol eras, call, jsonl, tools and doctor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library holds the commands, so in-process tests can run them with a test backend.
# Unit tests live in `tests.rs` files. Integration tests live in `tests/`.
[lib]
name = "ghidorah_cli"
path = "src/lib.rs"

[[bin]]
name = "ghidorah"
path = "src/main.rs"

[dependencies]
ghidorah-base = { path = "../base" }
ghidorah-json = { path = "../json" }
ghidorah-tools = { path = "../tools" }

[dev-dependencies]
ghidorah-testkit = { path = "../testkit" }

[lints]
workspace = true

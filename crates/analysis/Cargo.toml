[package]
name = "ghidorah-analysis"
description = "Analysis engine: the fuel-sliced scheduler, the discovery analyzers, why-records, the CFG and the call graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The crate has no unit tests. Its tests are in the test binary `tests/analysis/main.rs`.
[lib]
name = "ghidorah_analysis"
path = "src/lib.rs"
test = false

[dependencies]
ghidorah-base.workspace = true
ghidorah-db.workspace = true
ghidorah-ir.workspace = true
# The inputs hash and the metrics use JSON values.
ghidorah-json.workspace = true
ghidorah-kernel.workspace = true
ghidorah-loader.workspace = true
ghidorah-types.workspace = true
ghidorah-x86.workspace = true

[dev-dependencies]
ghidorah-testkit = { path = "../testkit" }
ghidorah-oracle = { path = "../oracle" }

[lints]
workspace = true

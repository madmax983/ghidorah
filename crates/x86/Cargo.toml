[package]
name = "ghidorah-x86"
description = "x86-64 length decoder, semantic decoder, operand model and Intel printer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The crate has no unit tests. Its tests are in the test binary `tests/x86/main.rs`
# and in the fuzz binary `tests/fuzz_x86_decode.rs`.
[lib]
name = "ghidorah_x86"
path = "src/lib.rs"
test = false

[dev-dependencies]
ghidorah-testkit = { path = "../testkit" }

[lints]
workspace = true

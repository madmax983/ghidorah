[package]
name = "ghidorah-db"
description = "Program database: managers, provenance facts, default names, function ownership and set storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Unit tests live in `src/**/tests.rs`, because the manager mutators are `pub(crate)`.
# The test binary `tests/db/main.rs` checks the public read API.
[lib]
name = "ghidorah_db"
path = "src/lib.rs"

[dependencies]
ghidorah-base.workspace = true
ghidorah-kernel.workspace = true
# The JSON codec of WP-11b uses this crate.
ghidorah-json.workspace = true
ghidorah-loader.workspace = true
ghidorah-types.workspace = true

[dev-dependencies]
ghidorah-testkit = { path = "../testkit" }

[lints]
workspace = true
